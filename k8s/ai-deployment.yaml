apiVersion: apps/v1
kind: Deployment
metadata:
  name: ihsan-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ihsan-ai
  template:
    metadata:
      labels:
        app: ihsan-ai
    spec:
      containers:
        - name: ai
          image: ihsan-ai:latest
          ports:
            - containerPort: 4101
---
apiVersion: v1
kind: Service
metadata:
  name: ihsan-ai
spec:
  selector:
    app: ihsan-ai
  ports:
    - port: 4101
      targetPort: 4101
      protocol: TCP
  type: ClusterIP
