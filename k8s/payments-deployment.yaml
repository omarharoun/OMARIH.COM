apiVersion: apps/v1
kind: Deployment
metadata:
  name: ihsan-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ihsan-payments
  template:
    metadata:
      labels:
        app: ihsan-payments
    spec:
      containers:
        - name: payments
          image: ihsan-payments:latest
          ports:
            - containerPort: 4102
---
apiVersion: v1
kind: Service
metadata:
  name: ihsan-payments
spec:
  selector:
    app: ihsan-payments
  ports:
    - port: 4102
      targetPort: 4102
      protocol: TCP
  type: ClusterIP
