apiVersion: apps/v1
kind: Deployment
metadata:
  name: ihsan-social
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ihsan-social
  template:
    metadata:
      labels:
        app: ihsan-social
    spec:
      containers:
        - name: social
          image: ihsan-social:latest
          ports:
            - containerPort: 4104
---
apiVersion: v1
kind: Service
metadata:
  name: ihsan-social
spec:
  selector:
    app: ihsan-social
  ports:
    - port: 4104
      targetPort: 4104
      protocol: TCP
  type: ClusterIP
